[project]
name = "clipper-engine"
version = "0.12.0"
description = "Local engine for the Stream Clipper desktop app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "keyring>=25",
    "platformdirs>=4",
    "httpx>=0.27",
    "streamlink>=8.6.3",
    "imageio-ffmpeg>=0.8.1",
    "websockets>=17.4",
    "anthropic>=2.8.0",
    "numpy>=2.5.4",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
